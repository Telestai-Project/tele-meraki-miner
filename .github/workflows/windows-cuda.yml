name: Windows CUDA miner

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gbt-disconnect-longpoll
      - main

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin CMake 3.26 (FindCUDA)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.26.4"

      - name: Install Perl (Hunter)
        run: choco install strawberryperl -y --no-progress

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc","cudart","nvrtc","visual_studio_integration"]'
          use-github-cache: true

      - name: Cache Hunter
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.hunter
          key: hunter-win-vs2022-3.26-${{ hashFiles('CMakeLists.txt', 'cmake/Hunter/config.cmake') }}

      - name: Configure
        env:
          CUDA_TOOLKIT_ROOT_DIR: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          cmake --version
          nvcc -V
          cmake -G "Visual Studio 17 2022" -A x64 -S . -B build `
            -DETHASHCUDA=ON -DETHASHCL=OFF -DETHASHCPU=OFF -DAPICORE=ON `
            -DCUDA_TOOLKIT_ROOT_DIR="$env:CUDA_TOOLKIT_ROOT_DIR" `
            -DHUNTER_JOBS_NUMBER=4

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        shell: pwsh
        run: |
          $out = "telemerakiminer-windows-cuda12"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter telemerakiminer.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "telemerakiminer.exe not found" }
          Copy-Item $exe.FullName $out\
          Get-ChildItem "$env:CUDA_PATH\bin\nvrtc*.dll" | Copy-Item -Destination $out\
          Copy-Item dist/windows-testnet/README-TESTNET.txt $out\
          Copy-Item dist/windows-testnet/mine-testnet.bat.example $out\
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip" -Force
          Get-ChildItem $out, "$out.zip" | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telemerakiminer-windows-cuda12
          path: telemerakiminer-windows-cuda12.zip
          if-no-files-found: error
